# Linear, as a sandbox tool: the viewer skill, one credential file, the CLI, and the host its API
# calls leave for. Plain KEY=value, read by sandbox.sh when a manifest names the tool in TOOLS.
# No path here is a directory except the skill: a credential is one file.
#
# The Linear app actor the CLI mints its token as. The grant is read-only on purpose: the skill
# documents writes, so the mount is the whole of what a sandbox gets, not the whole of the skill.

OPT_IN=true
SKILL_HOST=~/.agents/skills/linear
SKILL_CONTAINER=/home/node/.agents/skills/linear
CRED_HOST=~/.agent-secrets/linear-app.env
CRED_CONTAINER=/home/node/.agent-secrets/linear-app.env
CLI_HOST=~/.agents/skills/linear/scripts/linear-api.sh
CLI_CONTAINER=/usr/local/bin/linear-api.sh
HOSTS=api.linear.app:443
