# What a sandbox MAY inherit from the host, one line per entry. Nothing here is
# mounted on its own: an entry needs the grant named on its line, and every grant
# defaults to off in .sandbox.conf. No manifest = nothing inherited but the project.
#
#   dir|file <path> [ro] [auth] [grant=<KEY>] [exclude=<glob,glob>]
#   follow   <path>       [grant=<KEY>]     a link under an agent directory may resolve into this
#
#   path     ~ is $HOME, so entries follow the host and no repo layout leaks in
#   ro       read-only inside the container; the guest always gets its own copy
#   auth     forge credentials, granted by GIT_AUTH=true
#   grant    the boolean <KEY> in .sandbox.conf, granted by <KEY>=true
#   exclude  globs skipped when the guest copies the entry, mounts ignore it
#
# The agent directories are granted by AGENTS in the project manifest
# (AGENTS="pi claude codex"). ~/.claude is special: a sandbox gets the claude
# history of its own project only, never the other projects'.
#
# BASE=full grants the whole file at once, the way a sandbox behaved before every
# switch defaulted off. A new project gets a .sandbox.conf, not a wider default.
#
# Symlinks inside a mounted directory are not followed: mounting ~/.local/bin no
# longer drags in every repo the stow farm points at, and a host file a project
# needs gets its own MOUNTS line. The agent directories are the exception, see
# sandbox.sh: their real files live in the stow farm, so a link left dead there is
# not a narrowing but a pi that cannot read its own model list. A project symlink
# is resolved either way. An agent link is followed only into a follow root: the
# sandbox writes that directory, so a link planted in it would otherwise carry what
# it names into the next run.
#
# Not inherited on purpose:
#   the host shell stack (~/.zshenv, ~/.config/zsh) - it is built on zap plugin
#   clones and carries the synced shell history; both environments bring their own
#   ~/.ssh keys - the container gets none, the guest gets known_hosts plus config
#   and reaches the keys through the forwarded agent
#   the vault - project symlinks into the knowledge layers are refused, see below

follow ~/repos/dots          grant=AGENTS
dir   ~/.pi                  exclude=agent/npm,agent/git
# The host pi loads code from these two trees: npm packages it resolves from settings.json, and the
# git checkouts it builds extension packages from. A sandbox that could write there would hand the
# host code to run at the next start, the same door a writable extension directory was. Read-only,
# carved out of the writable ~/.pi above.
dir   ~/.pi/agent/npm        ro grant=AGENTS
dir   ~/.pi/agent/git        ro grant=AGENTS
# The permission extension is host-provided, and the host loads the same code. Mounted
# read-only so a sandbox cannot edit what the host will later execute. The policy is a
# separate file, so code and policy stay separable.
dir   ~/.pi/agent/npm/node_modules/@gotgenes/pi-permission-system   ro grant=AGENTS
# The host loads extensions from here, so a writable copy is a way for a sandbox to plant code
# the host later runs. Read-only, with the review log carved back out because the sandbox has to
# be able to write the record that proves what it did.
dir   ~/.pi/agent/extensions                                        ro grant=AGENTS
dir   ~/.pi/agent/extensions/pi-permission-system/logs                 grant=AGENTS
dir   ~/.agents
dir   ~/.codex
dir   ~/.claude
dir   ~/.local/bin           ro grant=LOCAL_BIN exclude=*.old
file  ~/.tmux.conf           grant=TMUX
dir   ~/.config/gh           ro auth
dir   ~/.config/glab-cli     ro auth
dir   ~/.config/git          ro auth
dir   ~/.config/git-private  ro auth
file  ~/.gitconfig           ro auth
