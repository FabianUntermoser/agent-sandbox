# What every sandbox inherits from the host, one line per entry.
#
#   dir|file <path> [ro] [auth] [exclude=<glob,glob>]
#
#   path     ~ is $HOME, so entries follow the host and no repo layout leaks in
#   ro       read-only inside the container; the guest always gets its own copy
#   auth     only when the project manifest keeps credentials (GIT_AUTH=true)
#   exclude  globs skipped when the guest copies the entry, mounts ignore it
#
# The host symlinks its dotfiles into the repos and both consumers follow them:
# the container mounts every symlink target at the same path, the guest copies the
# referent (-L). A new script in ~/.local/bin or a new skill in ~/.agents is
# inherited with no edit here; a new tool or secret directory is one line.
#
# The agent directories are gated by AGENTS in the project manifest. ~/.claude is
# special: a sandbox gets the claude history of its own project only, never the
# other projects'.
#
# Not inherited on purpose:
#   the host shell stack (~/.zshenv, ~/.config/zsh) - it is built on zap plugin
#   clones and carries the synced shell history; both environments bring their own
#   ~/.ssh keys - the container gets none, the guest gets known_hosts plus config
#   and reaches the keys through the forwarded agent
#   the vault - project symlinks into the knowledge layers are refused, see below

dir   ~/.local/bin           ro exclude=*.old
file  ~/.tmux.conf
dir   ~/.pi                  exclude=agent/npm,agent/git
dir   ~/.agents
dir   ~/.codex
dir   ~/.claude
dir   ~/.config/gh           ro auth
dir   ~/.config/glab-cli     ro auth
dir   ~/.config/git          ro auth
dir   ~/.config/git-private  ro auth
file  ~/.gitconfig           ro auth
