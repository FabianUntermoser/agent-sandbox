# What a sandbox MAY inherit from the host, one line per entry. Nothing here is
# mounted on its own: an entry needs the grant named on its line, and every grant
# defaults to off in .sandbox.conf. No manifest = nothing inherited but the project.
#
#   dir|file <path> [ro] [auth] [grant=<KEY>] [exclude=<glob,glob>]
#
#   path     ~ is $HOME, so entries follow the host and no repo layout leaks in
#   ro       read-only inside the container; the guest always gets its own copy
#   auth     forge credentials, granted by GIT_AUTH=true
#   grant    the boolean <KEY> in .sandbox.conf, granted by <KEY>=true
#   exclude  globs skipped when the guest copies the entry, mounts ignore it
#
# The agent directories are granted by AGENTS in the project manifest
# (AGENTS="pi claude codex"). ~/.claude is special: a sandbox gets the claude
# history of its own project only, never the other projects'.
#
# BASE=full grants the whole file at once, the way a sandbox behaved before every
# switch defaulted off. A new project gets a .sandbox.conf, not a wider default.
#
# Symlinks inside a mounted directory are not followed any more: mounting
# ~/.local/bin no longer drags in every repo the stow farm points at. A project
# symlink is still resolved, see sandbox.sh, and a host file a project needs gets
# its own MOUNTS line.
#
# Not inherited on purpose:
#   the host shell stack (~/.zshenv, ~/.config/zsh) - it is built on zap plugin
#   clones and carries the synced shell history; both environments bring their own
#   ~/.ssh keys - the container gets none, the guest gets known_hosts plus config
#   and reaches the keys through the forwarded agent
#   the vault - project symlinks into the knowledge layers are refused, see below

dir   ~/.pi                  exclude=agent/npm,agent/git
dir   ~/.agents
dir   ~/.codex
dir   ~/.claude
dir   ~/.local/bin           ro grant=LOCAL_BIN exclude=*.old
file  ~/.tmux.conf           grant=TMUX
dir   ~/.config/gh           ro auth
dir   ~/.config/glab-cli     ro auth
dir   ~/.config/git          ro auth
dir   ~/.config/git-private  ro auth
file  ~/.gitconfig           ro auth
