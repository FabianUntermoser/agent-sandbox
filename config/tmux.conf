# Sandbox tmux config: same keybinds as the host (~/.tmux.conf).
# Left out on purpose: tmux-resurrect/continuum (not installed here) and
# WAYLAND_DISPLAY passthrough (no compositor in the container).

## Options
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g mouse on
set -g history-limit 5000

set -g escape-time 10
set -sg repeat-time 600
set -s focus-events on
set -g extended-keys on
if-shell 'tmux -V | awk "{if (\$2 + 0 >= 3.5) exit 0; else exit 1}"' 'set -g extended-keys-format csi-u'

set -g base-index 1
setw -g pane-base-index 1

setw -g automatic-rename on
set -g renumber-windows on
set -g set-titles on
setw -g aggressive-resize on

set -g display-panes-time 800
set -g display-time 1000

# bell / activity
set-option -g bell-action any
set-option -g visual-bell off
set -g monitor-activity on
set -g visual-activity off

# statusbar
set-option -g status-position top
set -g status-left ""
set -g status-right " #S:#{pane_id} #{pane_title} "
set -g status-right-length 30
set -g status-style bg=default
set -g status-interval 10
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-style "fg=#a6adc8"
set -g window-status-current-style "fg=#1e1e2e,bg=#89b4fa,bold"
set -g window-status-activity-style "fg=#f9e2af"

## Mappings
set -g prefix C-s
set-window-option -g mode-keys vi

# open files edited in the current pi session (agent-tmux-pane.sh, mounted)
bind e run-shell 'SESSION_NAME="#{session_name}"; ~/.local/bin/agent-tmux-pane.sh edited-files'
bind E run-shell 'SESSION_NAME="#{session_name}"; ~/.local/bin/agent-tmux-pane.sh ls-edited'

# prefix p: prompt, open a new pi window at the current dir
bind p command-prompt -p "pi prompt:" "run-shell 'SESSION_NAME=\"#{session_name}\" ~/.local/bin/agent-tmux-pane.sh spawn -t \"#{session_name}\" -c \"#{pane_current_path}\" -m \"%1\" pi'"

# prefix o: open URLs and file paths from the current pane, needs rofi and a display
bind o if-shell 'command -v rofi >/dev/null && [ -n "$DISPLAY" ]' 'run-shell "SESSION_NAME=\"#{session_name}\" ~/.local/bin/open-url-from-pane.sh"' 'display-message "open-url-from-pane needs rofi and a display"'

# config reload
unbind r
bind r source-file ~/.tmux.conf

# sessions
bind C-c new-session
bind C-f command-prompt -p find-session 'switch-client -t %%'
bind BTab switch-client -l
bind X confirm-before -p "kill session #S? (y/n)" kill-session

# windows
bind - split-window -v
bind _ split-window -h

# navigate pane
bind-key -r h select-pane -L
bind-key -r j select-pane -D
bind-key -r k select-pane -U
bind-key -r l select-pane -R
bind > swap-pane -D
bind < swap-pane -U

# pane resizing
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# window navigation
unbind n
bind -r C-h previous-window
bind -r C-l next-window
bind -r C-S-H swap-window -t -1 \; select-window -t -1
bind -r C-S-L swap-window -t +1 \; select-window -t +1
bind Tab last-window

# copy mode
bind Enter copy-mode

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line
